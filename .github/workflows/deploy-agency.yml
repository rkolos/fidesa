name: Deploy fidesa.agency

on:
  push:
    branches: [develop]
  workflow_dispatch:

concurrency:
  group: deploy-agency
  cancel-in-progress: true

jobs:
  deploy-agency:
    name: Deploy EN → fidesa.agency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build CSS and sync static into public/
        run: python3 scripts/build_static.py --no-rewrite

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Add server to known_hosts
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Rsync public/en-site → www/
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH_AGENCY }}
        run: |
          set -euo pipefail
          rsync -az --delete \
            -e "ssh -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes" \
            public/en-site/ \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${DEPLOY_PATH}"
